<!DOCTYPE html>
<html>
<head>
    <title>QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
        }

        input {
            width: 250px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #00c6ff;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        #qrcode {
            margin-top: 20px;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>QR Code Generator</h1>
        <input type="text" id="text" placeholder="Enter text or URL">
        <br>
        <button onclick="generateQR()">Generate QR</button>

        <div id="qrcode"></div>
        <a id="download" style="display:none;" download="qrcode.png">Download QR</a>
    </div>

<script>
function generateQR() {
    let text = document.getElementById("text").value;
    let qrcodeDiv = document.getElementById("qrcode");
    qrcodeDiv.innerHTML = "";

    let qr = new QRCode(qrcodeDiv, {
        text: text,
        width: 200,
        height: 200
    });

    setTimeout(() => {
        let img = qrcodeDiv.querySelector("img");
        let downloadLink = document.getElementById("download");
        downloadLink.href = img.src;
        downloadLink.style.display = "block";
    }, 300);
}
</script>

</body>
</html>
